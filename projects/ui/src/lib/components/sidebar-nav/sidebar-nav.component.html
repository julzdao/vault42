<nav class="sub-nav" id="sidebar-nav">
      @if (selected(); as selected) {
            <button type="button" (click)="onNavigateBack()"><< All Notes</button>

            @if(selected.upSlug) {
                  <button class="up-button" type="button" (click)="openNote(selected.upSlug)">{{ selected.up }} ↑</button>
            }
            
      } @else {
            <button type="button" (click)="navigateHome()">About</button>
            <a id="github-button" aria-label="Github" href="https://github.com/julzdao/vault42" target="_blank">
                  <img src="github.svg" role="img" alt="Github logo" />
            </a>
      }
      <!-- <v42-search-bar [defaultQuery]="q ?? ''" [notes]="searchCandidates()" (select)="onSearchSelect($event)"></v42-search-bar> -->
</nav>
